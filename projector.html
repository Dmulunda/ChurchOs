<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VPD Projection</title>
  <link rel="icon" type="image/png" href="img/church-on-point-icon.png" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    body {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      color: #fff;
    }
    body.is-fullscreen.controls-idle {
      cursor: none;
    }
    #exit-fullscreen-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      z-index: 20;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 0.5rem;
      padding: 0.5rem 0.9rem;
      font-size: 0.9rem;
      cursor: pointer;
      opacity: 1;
      transition: opacity 0.3s;
    }
    body:not(.is-fullscreen) #exit-fullscreen-btn {
      display: none;
    }
    body.is-fullscreen.controls-idle #exit-fullscreen-btn {
      opacity: 0;
      pointer-events: none;
    }
    #backdrop {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 0;
    }
    #lines {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 92vw;
      max-height: 78vh;
      overflow: hidden;
    }
    #lines p {
      margin: 0 0 0.45em 0;
      line-height: 1.3;
      font-weight: 600;
      letter-spacing: -0.005em;
      text-shadow: 0 2px 12px rgba(0,0,0,0.65), 0 0 2px rgba(0,0,0,0.5);
    }
    /* Short cross-fade when new content appears (not on a text-size
       change of the same slide). */
    @keyframes proj-fade { from { opacity: 0; } to { opacity: 1; } }
    .fade { animation: proj-fade 0.28s ease-out both; }
    #reference {
      position: absolute;
      bottom: 4vh;
      right: 4vw;
      z-index: 1;
      font-size: clamp(1rem, 1.9vw, 1.6rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      color: rgba(255,255,255,0.7);
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }
    #image-slide {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }
    #video-container {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: none;
    }
    #video-container iframe,
    #video-container video {
      width: 100%;
      height: 100%;
    }
    #idle {
      position: absolute;
      z-index: 1;
      opacity: 0.16;
    }
    #idle img { width: min(22vw, 320px); height: auto; display: block; filter: grayscale(1) brightness(1.6); }
    #countdown-container {
      position: relative;
      z-index: 1;
      text-align: center;
      display: none;
    }
    #countdown-text {
      font-size: clamp(1.2rem, 4vw, 3rem);
      margin-bottom: 0.3em;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }
    #countdown-clock {
      font-size: clamp(3rem, 14vw, 10rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }
    #presentation-slide {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4vw;
      box-sizing: border-box;
    }
    #presentation-slide img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    #presentation-slide p {
      font-size: clamp(1.5rem, 5vw, 4rem);
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="backdrop"></div>
  <div id="lines"></div>
  <div id="reference"></div>
  <img id="image-slide" alt="" />
  <div id="video-container"></div>
  <div id="countdown-container">
    <div id="countdown-text"></div>
    <div id="countdown-clock"></div>
  </div>
  <div id="presentation-slide"></div>
  <div id="idle"><img src="img/vpd-logo.png" alt="" /></div>
  <button type="button" id="exit-fullscreen-btn">✕ Exit fullscreen / Quitter</button>
  <script type="module" src="js/projectorPage.js"></script>
</body>
</html>
