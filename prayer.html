<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prayer Request</title>
  <link rel="icon" type="image/png" href="img/church-on-point-icon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div class="max-w-md mx-auto px-4 py-8 sm:py-12">
    <div id="prayer-header" class="mb-6">
      <div class="flex items-center gap-3 mb-1">
        <img src="img/church-on-point-icon.png" alt="" class="h-10 w-10 object-contain rounded" />
        <h1 class="text-lg font-bold text-slate-800">&nbsp;</h1>
      </div>
      <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wide" data-i18n="prayerRequest.publicFormTitle">Prayer Request</h2>
      <p class="text-sm text-slate-500 mt-1" data-i18n="prayerRequest.publicFormIntro">Share what's on your heart. Our church is praying for you.</p>
    </div>
    <div id="public-prayer-content">
      <p class="text-slate-500 bg-white rounded-xl shadow p-4 sm:p-6">Loading…</p>
    </div>
  </div>
  <script type="module" src="js/publicPrayerRequest.js"></script>
</body>
</html>
